name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies if declared
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Check Python syntax
        shell: bash
        run: |
          if [ -d src ]; then python -m compileall -q src; fi
          if [ -d tests ]; then python -m compileall -q tests; fi
      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q tests
          else
            echo 'No tests yet; scaffold check only.'
          fi
      # When dataset/notebook is implemented, extend CI to execute a small,
      # deterministic smoke workflow with test-accessible data, no credentials.
