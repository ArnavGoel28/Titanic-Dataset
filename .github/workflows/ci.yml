name: Titanic checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q titanic.py tests
      - name: Check notebook and result consistency
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      # The account-gated Kaggle ZIP is intentionally not redistributed.
      # A local run with the ZIP also executes the real-data preparation test.
